name: Windows paketi

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Testler
        run: mvn -B verify

      - name: jlink + jpackage (app-image)
        run: SKIP_TESTS=1 bash packaging/paketle.sh

      - name: Paketlenen uygulamayi kontrol et
        run: |
          test -f dist/YOBF-Otomator/YOBF-Otomator.exe
          test -f dist/YOBF-Otomator/config/ayarlar.json
          test -f dist/YOBF-Otomator/assets/logos/kalyon-enerji.png
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: YOBF-Otomator-windows
          path: dist/*.zip
          if-no-files-found: error

      - name: Surum yayini (etiketlerde)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
